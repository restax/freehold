# Optional overlay: a local OpenSign instance for e-signature development —
# the provider Freehold operates centrally (see packages/integrations/src/
# esign/opensign.ts), not one each tenant brings their own account for.
# All secrets below are DEV-ONLY defaults — never expose this stack to the
# internet as-is, and never reuse APP_ID/MASTER_KEY in production.
#
#   docker compose -f docker-compose.opensign.yml up -d
#   Server API root: http://localhost:8081/app
#
# Then in .env:
#   FREEHOLD_OPENSIGN_URL=http://localhost:8081
#   FREEHOLD_OPENSIGN_APP_ID=freehold-dev
#   FREEHOLD_OPENSIGN_MASTER_KEY=freehold-dev-master-key-not-for-production
#
# Only the server (Parse Server + its cloud code) runs here — OpenSign's own
# web client and Caddy reverse proxy aren't needed since Freehold's own
# dashboard is the UI; Freehold talks to the server's REST API directly.

services:
  opensign-mongo:
    image: mongo:latest
    volumes:
      - opensign_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensign-server:
    image: opensign/opensignserver:main
    ports:
      - "8081:8080"
    depends_on:
      opensign-mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_ID: freehold-dev
      appName: freehold_dev_opensign
      MASTER_KEY: freehold-dev-master-key-not-for-production
      MONGODB_URI: mongodb://opensign-mongo:27017/opensign
      PARSE_MOUNT: /app
      SERVER_URL: http://localhost:8081/app
      PUBLIC_URL: http://localhost:8081/

volumes:
  opensign_mongodata:
