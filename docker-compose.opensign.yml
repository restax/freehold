# Optional overlay: a local OpenSign instance for e-signature development —
# the provider Freehold operates centrally (see packages/integrations/src/
# esign/opensign.ts), not one each tenant brings their own account for.
# All secrets below are DEV-ONLY defaults — never expose this stack to the
# internet as-is, and never reuse APP_ID/MASTER_KEY in production.
#
#   docker compose -f docker-compose.opensign.yml up -d
#   Everything on one origin: http://localhost:8081
#     - Parse API root:      http://localhost:8081/api/app
#     - Signing pages:       http://localhost:8081/login/<token>
#
# Then in .env:
#   FREEHOLD_OPENSIGN_URL=http://localhost:8081
#   FREEHOLD_OPENSIGN_MOUNT=/api/app
#   FREEHOLD_OPENSIGN_APP_ID=opensign
#   FREEHOLD_OPENSIGN_MASTER_KEY=freehold-dev-master-key-not-for-production
#
# Why the client and the reverse proxy are here even though Freehold's own
# dashboard is the UI: Freehold sends and polls over the REST API, but the
# *signer* is a member of the public who lands on OpenSign's own signing page.
# That page is served by the `client` container, and it only works when client
# and server share one origin — OpenSign's own deployment does this with Caddy,
# and its guest-signing flow breaks with cross-origin 403s otherwise. Running
# the server alone is enough to send a document but not to have anyone sign it.

services:
  opensign-mongo:
    image: mongo:latest
    volumes:
      - opensign_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensign-server:
    image: opensign/opensignserver:main
    depends_on:
      opensign-mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # MUST be `opensign`: the stock client image bakes this app id in at build
      # time (only REACT_APP_SERVERURL is runtime-configurable in its entrypoint),
      # so any other value makes every call from the signing page fail Parse's
      # app-id check with a bare 403 `unauthorized`.
      APP_ID: opensign
      appName: freehold_dev_opensign
      MASTER_KEY: freehold-dev-master-key-not-for-production
      MONGODB_URI: mongodb://opensign-mongo:27017/opensign
      PARSE_MOUNT: /app
      # Must be the *public* origin, not the container address: these are baked
      # into the file/download URLs handed out to signers.
      SERVER_URL: http://localhost:8081/api/app
      PUBLIC_URL: http://localhost:8081
      # OpenSign digitally signs the finished PDF, and refuses to complete a
      # signature without a P12 certificate — `Buffer.from(undefined)` throws
      # inside its signPdf handler and the signer just sees "something went
      # wrong". This is a THROWAWAY self-signed cert for local development
      # only: it is committed deliberately, protects nothing, and must never be
      # used in production. Generate a real one for the live deployment:
      #   openssl req -x509 -newkey rsa:2048 -keyout k.pem -out c.pem -days 3650 \
      #     -nodes -subj "/CN=Your Co"
      #   openssl pkcs12 -export -out cert.p12 -inkey k.pem -in c.pem -passout pass:SECRET
      #   base64 -i cert.p12 | tr -d '\n'
      PFX_BASE64: 
      PASS_PHRASE: freeholddev

  opensign-client:
    image: opensign/opensign:main
    depends_on:
      - opensign-server
    environment:
      REACT_APP_SERVERURL: http://localhost:8081/api/app
      PUBLIC_URL: http://localhost:8081

  opensign-proxy:
    image: caddy:latest
    depends_on:
      - opensign-client
      - opensign-server
    ports:
      - "8081:8081"
    # /api/* is stripped and forwarded to Parse (whose own mount is /app), so
    # the public path /api/app maps onto the server's /app.
    configs:
      - source: opensign_caddyfile
        target: /etc/caddy/Caddyfile

configs:
  opensign_caddyfile:
    content: |
      :8081 {
        handle_path /api/* {
          reverse_proxy opensign-server:8080
        }
        reverse_proxy opensign-client:3000
      }

volumes:
  opensign_mongodata:
