# CLA signing gate — every external contributor signs once, on their first PR.
# Uses CLA Assistant Lite; signatures are stored on the `cla-signatures` branch
# of this repo. The agreement text lives in docs/CLA.md.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/docs/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],renovate[bot]"
